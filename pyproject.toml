[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ad"
version = "0.3.0"
description = "Lightweight, strictly causal, lookahead-free streaming time-series anomaly detection engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Likhit & Lokesh" }
]
license = { text = "MIT" }
keywords = ["anomaly-detection", "time-series", "streaming", "extreme-value-theory", "nab"]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "streamlit>=1.20",
    "plotly>=5.0",
    "matplotlib>=3.5",
]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
